<head>

    <title>simple form</title>
</head>
<body>

        <fieldset>
            <ol>
                <li><h4>Burger</h4></li>
                <img height="100px" src="images/bur.jpg" alt="">

                <img height="100px" src="images/piz.jpg" alt="">
                <li><h4>Biriyani</h4></li>
                <img width="100px" src="images/bur.jpg" alt="">

        </fieldset>
